<style>
  :root {
    /* Latar Utama Polosan Royal Maroon & Permukaan Kartu Krem Gading */
    --bg-kraton: #26080E;
    --bg-sogan: #FAF3E8;
    --surface-sogan: #F1E5D3;

    /* Warna Teks di Atas Latar Gelap (Royal Maroon #26080E) — Dijamin Terang & Kontras Tinggi */
    --text-on-dark: #FAF3E8;
    --text-muted-on-dark: #E8D5C4;
    --gold-on-dark: #F3E5AB;
    --gold-accent: #D4AF37;

    /* Warna Teks di Dalam Kartu Krem Gading (#FAF3E8 / #F1E5D3) — Dijamin Maroon Gelap & Tegas */
    --text-on-cream: #2B0910;
    --text-muted-on-cream: #6D343E;
    --maroon-accent: #8B1C29;
    --maroon-deep: #5C121B;

    --gold-border: rgba(212, 175, 55, 0.45);
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  html {
    scroll-behavior: smooth;
  }

  /* Background Polosan Royal Maroon (#26080E) Saat Di-scroll */
  body {
    background-color: var(--bg-kraton);
    background-image: none;
    color: var(--text-on-dark);
    font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    line-height: 1.65;
    overflow-x: hidden;
  }

  h1, h2, h3, h4, .couple-title, .hero-couple-names, .section-heading {
    font-family: 'Cormorant Garamond', Georgia, serif;
  }

  /* Kicker di dalam kartu krem */
  .kicker-gold,
  .kicker-maroon {
    font-size: 11px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--maroon-accent);
    font-weight: 700;
  }

  /* Kicker di atas background gelap (polosan maroon / scrim foto) */
  .kicker-bright-gold {
    font-size: 11px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--gold-on-dark);
    font-weight: 700;
  }

  .mono-gold, .mono-maroon, .rekening-num, .cd-number, #pin-input {
    font-family: 'JetBrains Mono', monospace;
    font-variant-numeric: tabular-nums;
  }

  .mono-maroon {
    color: var(--maroon-accent);
    font-size: 12px;
    font-weight: 600;
  }

  /* ==========================================================================
     STAGGERED ENTRANCE / CASCADE ANIMATION SYSTEM (60 FPS GPU-ACCELERATED)
     ========================================================================== */
  @keyframes coverBgJogloIn {
    0% { opacity: 0; transform: scale3d(1.04, 1.04, 1); }
    100% { opacity: 1; transform: scale3d(1, 1, 1); }
  }

  @keyframes cornerOrnamentIn {
    0% { opacity: 0; transform: scale3d(0.94, 0.94, 1); }
    100% { opacity: 1; transform: scale3d(1, 1, 1); }
  }

  @keyframes archContainerIn {
    0% { opacity: 0; transform: translate3d(0, 25px, 0); }
    100% { opacity: 1; transform: translate3d(0, 0, 0); }
  }

  @keyframes archPhotoPopIn {
    0% { opacity: 0; transform: scale3d(0.92, 0.92, 1); }
    100% { opacity: 1; transform: scale3d(1, 1, 1); }
  }

  @keyframes coupleNamesSlideUp {
    0% { opacity: 0; transform: translate3d(0, 15px, 0); }
    100% { opacity: 1; transform: translate3d(0, 0, 0); }
  }

  @keyframes ctaButtonFadeIn {
    0% { opacity: 0; transform: translate3d(0, 10px, 0); }
    100% { opacity: 1; transform: translate3d(0, 0, 0); }
  }

  @keyframes ctaSubtlePulse {
    0%, 100% { transform: scale3d(1, 1, 1); }
    50% { transform: scale3d(1.028, 1.028, 1); }
  }

  @keyframes ctaGlowRing {
    0%, 100% { opacity: 0.22; transform: scale3d(0.98, 0.98, 1); }
    50% { opacity: 0.65; transform: scale3d(1.04, 1.08, 1); }
  }

  @keyframes modalCoverExit {
    0% { opacity: 1; transform: scale3d(1, 1, 1); }
    100% { opacity: 0; transform: scale3d(0.94, 0.94, 1); }
  }

  @keyframes heroRightPhotoIn {
    0% { opacity: 0; transform: translate3d(30px, 0, 0); }
    100% { opacity: 1; transform: translate3d(0, 0, 0); }
  }

  @keyframes heroLeftGreetingIn {
    0% { opacity: 0; transform: translate3d(-25px, 0, 0); }
    100% { opacity: 1; transform: translate3d(0, 0, 0); }
  }

  @keyframes heroQuoteCtaIn {
    0% { opacity: 0; transform: translate3d(0, 20px, 0); }
    100% { opacity: 1; transform: translate3d(0, 0, 0); }
  }

  @keyframes heroChromeReveal {
    0% { opacity: 0; transform: translate3d(0, 18px, 0); }
    100% { opacity: 1; transform: translate3d(0, 0, 0); }
  }

  .anim-phase1-bg {
    opacity: 0;
    will-change: transform, opacity;
    animation: coverBgJogloIn 1.2s cubic-bezier(0.16, 1, 0.3, 1) 0s forwards;
  }

  .anim-phase1-corners {
    opacity: 0;
    will-change: transform, opacity;
    animation: cornerOrnamentIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0.3s forwards;
  }

  .anim-phase1-card {
    opacity: 0;
    will-change: transform, opacity;
    animation: archContainerIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0.6s forwards;
  }

  .anim-phase1-photo {
    opacity: 0;
    will-change: transform, opacity;
    animation: archPhotoPopIn 0.5s cubic-bezier(0.16, 1, 0.3, 1) 0.9s forwards;
  }

  .anim-phase1-names {
    opacity: 0;
    will-change: transform, opacity;
    animation: coupleNamesSlideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) 1.2s forwards;
  }

  .anim-phase1-cta {
    opacity: 0;
    will-change: transform, opacity;
    animation:
      ctaButtonFadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) 1.5s forwards,
      ctaSubtlePulse 2.8s cubic-bezier(0.16, 1, 0.3, 1) 1.95s infinite;
  }

  .anim-phase2-exit {
    pointer-events: none;
    will-change: transform, opacity;
    animation: modalCoverExit 0.5s cubic-bezier(0.16, 1, 0.3, 1) 0s forwards;
  }

  .anim-phase3-photo-right {
    opacity: 0;
    will-change: transform, opacity;
    animation: heroRightPhotoIn 0.75s cubic-bezier(0.16, 1, 0.3, 1) 0.1s forwards;
  }

  .anim-phase3-text-left {
    opacity: 0;
    will-change: transform, opacity;
    animation: heroLeftGreetingIn 0.75s cubic-bezier(0.16, 1, 0.3, 1) 0.4s forwards;
  }

  .anim-phase3-quote-cta {
    opacity: 0;
    will-change: transform, opacity;
    animation: heroQuoteCtaIn 0.75s cubic-bezier(0.16, 1, 0.3, 1) 0.7s forwards;
  }

  .anim-phase3-chrome {
    opacity: 0;
    will-change: transform, opacity;
    animation: heroChromeReveal 0.75s cubic-bezier(0.16, 1, 0.3, 1) 1.0s forwards;
  }

  /* ==========================================================================
     HALAMAN 1 (COVER PIN): TANPA SCROLLBAR & PROPORSIONAL DI SEMUA LAYAR
     ========================================================================== */
  .pin-gate-overlay {
    position: fixed;
    inset: 0;
    z-index: 50;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 12px 16px;
    background: #26080E;
  }

  .couple-bg-layer {
    position: absolute;
    inset: 0;
  }

  .gate-bg-img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center;
    display: block;
  }

  .gate-bg-scrim {
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, rgba(38, 8, 14, 0.76) 0%, rgba(59, 14, 23, 0.48) 50%, rgba(38, 8, 14, 0.88) 100%);
  }

  /* Ornamen 4 Sudut Emas */
  .gold-corner {
    position: fixed;
    width: 56px;
    height: 56px;
    z-index: 15;
    pointer-events: none;
  }
  .corner-tl { top: 14px; left: 14px; border-top: 2px solid rgba(212, 175, 55, 0.85); border-left: 2px solid rgba(212, 175, 55, 0.85); border-top-left-radius: 10px; }
  .corner-tr { top: 14px; right: 14px; border-top: 2px solid rgba(212, 175, 55, 0.85); border-right: 2px solid rgba(212, 175, 55, 0.85); border-top-right-radius: 10px; }
  .corner-bl { bottom: 14px; left: 14px; border-bottom: 2px solid rgba(212, 175, 55, 0.85); border-left: 2px solid rgba(212, 175, 55, 0.85); border-bottom-left-radius: 10px; }
  .corner-br { bottom: 14px; right: 14px; border-bottom: 2px solid rgba(212, 175, 55, 0.85); border-right: 2px solid rgba(212, 175, 55, 0.85); border-bottom-right-radius: 10px; }

  /* Rangkaian Bunga Sakura SVG di Sudut Layar, Pintu, Kartu & Bingkai */
  .sakura-screen-corner {
    position: fixed;
    width: 96px;
    height: 96px;
    z-index: 19;
    pointer-events: none;
    filter: drop-shadow(0 6px 14px rgba(15, 2, 5, 0.65));
  }
  .ssc-tl { top: 6px; left: 6px; }
  .ssc-tr { top: 6px; right: 6px; transform: scaleX(-1); }

  .sakura-door-cluster {
    position: absolute;
    width: 78px;
    height: 78px;
    pointer-events: none;
    z-index: 4;
    filter: drop-shadow(0 4px 10px rgba(0, 0, 0, 0.5));
  }
  .sdc-tl { top: 8px; left: 8px; }
  .sdc-bl { bottom: 8px; left: 8px; transform: scaleY(-1); }
  .sdc-tr { top: 8px; right: 8px; transform: scaleX(-1); }
  .sdc-br { bottom: 8px; right: 8px; transform: scale(-1, -1); }

  .sakura-card-corner {
    position: absolute;
    width: 68px;
    height: 68px;
    pointer-events: none;
    z-index: 25;
    filter: drop-shadow(0 4px 10px rgba(38, 8, 14, 0.35));
  }
  .scc-tl { top: 6px; left: 6px; }
  .scc-tr { top: 6px; right: 6px; transform: scaleX(-1); }
  .scc-bl { bottom: -10px; left: -10px; transform: scaleY(-1); }
  .scc-br { bottom: -10px; right: -10px; transform: scale(-1, -1); }

  .arch-photo-wrap {
    position: relative;
    width: 210px;
    height: 176px;
    margin: 0 auto 12px;
  }

  .sakura-photo-corner {
    position: absolute;
    width: 58px;
    height: 58px;
    z-index: 10;
    pointer-events: none;
    filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.45));
  }
  .spc-tl { top: -10px; left: -16px; }
  .spc-tr { top: -10px; right: -16px; transform: scaleX(-1); }

  .cta-pulse-wrap {
    position: relative;
    display: block;
    width: 100%;
  }

  .cta-glow-halo {
    position: absolute;
    inset: -4px;
    border-radius: 12px;
    background: linear-gradient(90deg, rgba(212, 175, 55, 0.4), rgba(243, 229, 171, 0.55), rgba(212, 175, 55, 0.4));
    filter: blur(8px);
    pointer-events: none;
    animation: ctaGlowRing 2.8s cubic-bezier(0.16, 1, 0.3, 1) 1.95s infinite;
  }

  /* Kartu Kubah Halaman Pertama Input PIN — TANPA SCROLLBAR (overflow: visible) */
  .pin-gate-card.arch-card {
    position: relative;
    z-index: 22;
    max-width: 400px;
    width: 100%;
    overflow: visible;
    border-radius: 135px 135px 20px 20px;
    background: rgba(250, 243, 232, 0.97);
    color: var(--text-on-cream);
    backdrop-filter: blur(12px);
    border: 2px solid #D4AF37;
    padding: 20px 22px 22px;
    text-align: center;
    box-shadow: 0 25px 80px rgba(20, 3, 6, 0.92);
  }

  .arch-photo-frame {
    position: relative;
    width: 100%;
    height: 100%;
    border-radius: 95px 95px 14px 14px;
    overflow: hidden;
    border: 2px solid #D4AF37;
    background: #26080E;
    box-shadow: 0 12px 30px rgba(38, 8, 14, 0.55);
  }

  /* Framing Gambar 1 (Drive 1: 11U5mxsda2pUewOnUqs7p8ChCxcG8d32A — Dimas & Ulfa di kiri-kanan kain Aksara Jawa) */
  .arch-photo-img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: 50% 45%;
    display: block;
  }

  .arch-photo-scrim {
    position: absolute;
    inset: 0;
    background: linear-gradient(0deg, rgba(38, 8, 14, 0.85) 0%, transparent 50%);
  }

  /* Tanggal di Dalam Foto Arch — Emas Terang Kontras Tinggi di Atas Scrim Gelap */
  .arch-date-badge {
    position: absolute;
    bottom: 8px;
    left: 50%;
    transform: translateX(-50%);
    padding: 3px 12px;
    border-radius: 999px;
    background: rgba(38, 8, 14, 0.92);
    border: 1px solid rgba(212, 175, 55, 0.75);
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.18em;
    color: #F3E5AB;
    white-space: nowrap;
  }

  .couple-title {
    font-size: clamp(1.85rem, 4vw, 2.5rem);
    font-weight: 700;
    line-height: 1.1;
    margin-top: 4px;
    color: var(--text-on-cream);
  }

  .couple-title span, .hero-couple-names span {
    color: var(--maroon-accent);
    font-style: italic;
    font-weight: 400;
  }

  .date-subtitle {
    font-size: 12px;
    color: var(--text-muted-on-cream);
    margin-top: 6px;
  }

  .gate-divider {
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(139, 28, 41, 0.35), transparent);
    margin: 12px 0;
  }

  .gate-lead-text {
    font-size: 12.5px;
    color: var(--text-muted-on-cream);
    max-width: 360px;
    margin: 0 auto 14px;
    line-height: 1.5;
  }

  .pin-input-modal-box {
    background: var(--surface-sogan);
    border: 1px solid rgba(139, 28, 41, 0.35);
    border-radius: 12px;
    padding: 14px 16px;
    text-align: left;
  }

  .pin-box-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
  }

  .btn-link-back {
    background: none;
    border: none;
    color: var(--text-muted-on-cream);
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
  }

  /* ==========================================================================
     PINTU GERBANG AGUNG 3D & PERTUNJUKAN SAKURA BERLAPIS
     ========================================================================== */
  @keyframes gasGateLeftSwing {
    0%, 10% {
      transform: perspective(1600px) rotateY(0deg) translate3d(0, 0, 0);
      opacity: 1;
    }
    82% {
      transform: perspective(1600px) rotateY(72deg) translate3d(-44%, 0, 0);
      opacity: 0.96;
    }
    100% {
      transform: perspective(1600px) rotateY(86deg) translate3d(-58%, 0, 0);
      opacity: 0;
    }
  }

  @keyframes gasGateRightSwing {
    0%, 10% {
      transform: perspective(1600px) rotateY(0deg) translate3d(0, 0, 0);
      opacity: 1;
    }
    82% {
      transform: perspective(1600px) rotateY(-72deg) translate3d(44%, 0, 0);
      opacity: 0.96;
    }
    100% {
      transform: perspective(1600px) rotateY(-86deg) translate3d(58%, 0, 0);
      opacity: 0;
    }
  }

  @keyframes gasSeamGlow {
    0%, 8% { opacity: 0; transform: translateX(-50%) scaleX(0.4); }
    30% { opacity: 1; transform: translateX(-50%) scaleX(2.4); }
    85% { opacity: 0.45; transform: translateX(-50%) scaleX(4.2); }
    100% { opacity: 0; transform: translateX(-50%) scaleX(5.5); }
  }

  .royal-gate-doors {
    position: fixed;
    inset: 0;
    z-index: 18;
    display: flex;
    perspective: 1600px;
    pointer-events: none;
  }

  .gate-seam-burst {
    position: absolute;
    left: 50%;
    top: 0;
    bottom: 0;
    width: 14px;
    transform: translateX(-50%);
    background: linear-gradient(180deg, transparent, #FFF8DC, #D4AF37, #FFF8DC, transparent);
    filter: blur(6px);
    opacity: 0;
    z-index: 25;
  }

  .royal-gate-doors.is-opening .gate-seam-burst {
    animation: gasSeamGlow 3.6s cubic-bezier(0.22, 1, 0.36, 1) forwards;
  }

  .gate-door {
    width: 50%;
    height: 100%;
    padding: 18px;
    background: linear-gradient(135deg, rgba(24, 4, 8, 0.86) 0%, rgba(43, 9, 16, 0.78) 55%, rgba(58, 12, 21, 0.88) 100%);
    backdrop-filter: blur(2px);
    box-shadow: 0 0 60px rgba(0, 0, 0, 0.85);
    will-change: transform, opacity;
  }

  .gate-door-left {
    border-right: 3px solid #D4AF37;
    transform-origin: left center;
  }

  .gate-door-right {
    border-left: 3px solid #D4AF37;
    transform-origin: right center;
  }

  .royal-gate-doors.is-opening .gate-door-left {
    animation: gasGateLeftSwing 3.6s cubic-bezier(0.22, 1, 0.36, 1) forwards;
  }

  .royal-gate-doors.is-opening .gate-door-right {
    animation: gasGateRightSwing 3.6s cubic-bezier(0.22, 1, 0.36, 1) forwards;
  }

  .gate-door-inner {
    width: 100%;
    height: 100%;
    border: 2px solid rgba(212, 175, 55, 0.55);
    border-radius: 8px;
    position: relative;
    display: flex;
    align-items: center;
  }

  .gate-carving-lines {
    position: absolute;
    inset: 14px;
    border: 1px dashed rgba(243, 229, 171, 0.32);
    border-radius: 6px;
    pointer-events: none;
  }

  .gate-medallion {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .gate-medallion-left { right: 12px; }
  .gate-medallion-right { left: 12px; }

  .gate-gunungan-icon {
    font-size: 30px;
    color: #F3E5AB;
    text-shadow: 0 0 18px rgba(212, 175, 55, 0.8);
  }

  .gate-handle {
    display: inline-block;
    width: 12px;
    height: 84px;
    border-radius: 999px;
    background: linear-gradient(180deg, #F3E5AB 0%, #D4AF37 50%, #8C6D1F 100%);
    box-shadow: 0 0 22px rgba(212, 175, 55, 0.9);
  }

  /* ==========================================================================
     SECTION 01 (#hero): BACKGROUND AULA JOGLO HANYA DI SECTION PERTAMA SAJA
     Saat di-scroll ke bawah, transisi halus ke background polosan #26080E
     ========================================================================== */
  .hero-section-first {
    position: relative;
    overflow: hidden;
    padding: 44px 0 72px;
    border-bottom: 1px solid var(--gold-border);
  }

  .hero-joglo-bg-only {
    position: absolute;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    overflow: hidden;
  }

  .hero-joglo-scrim {
    position: absolute;
    inset: 0;
    background:
      radial-gradient(circle at 50% 24%, rgba(243, 229, 171, 0.16) 0%, transparent 55%),
      linear-gradient(180deg, rgba(38, 8, 14, 0.50) 0%, rgba(38, 8, 14, 0.45) 55%, #26080E 100%);
  }

  .hero-inner-container {
    position: relative;
    z-index: 2;
    padding-bottom: 0 !important;
  }

  .sakura-hero-canopy {
    position: absolute;
    width: 135px;
    height: 135px;
    z-index: 3;
    pointer-events: none;
    filter: drop-shadow(0 8px 18px rgba(15, 2, 5, 0.7));
  }
  .shc-tl { top: 10px; left: 10px; }
  .shc-tr { top: 10px; right: 10px; transform: scaleX(-1); }

  .hero-stage-center {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    margin-bottom: 28px;
  }

  .hero-stage-pill {
    display: inline-block;
    padding: 6px 16px;
    border-radius: 999px;
    background: rgba(38, 8, 14, 0.90);
    border: 1px solid rgba(212, 175, 55, 0.65);
    color: #F3E5AB;
    font-size: 10px;
    letter-spacing: 0.22em;
    font-weight: 700;
    margin-bottom: 18px;
    box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
  }

  .hero-center-welcome-card {
    max-width: 860px;
    margin: 0 auto;
    text-align: center;
    box-shadow: 0 25px 70px rgba(14, 2, 5, 0.85);
  }

  .sakura-bridal-frame-outer {
    position: relative;
    display: inline-block;
    padding: 10px;
    border-radius: 150px 150px 24px 24px;
    background: linear-gradient(180deg, #F3E5AB 0%, #D4AF37 55%, #8C6D1F 100%);
    box-shadow: 0 25px 70px rgba(18, 2, 5, 0.95);
  }

  /* 4 Sudut Rangkaian Bunga Sakura SVG pada Bingkai Pengantin Utama */
  .sakura-frame-cluster {
    position: absolute;
    width: 86px;
    height: 86px;
    z-index: 8;
    pointer-events: none;
    filter: drop-shadow(0 6px 12px rgba(18, 2, 5, 0.65));
  }
  .sfc-tl { top: -18px; left: -24px; }
  .sfc-tr { top: -18px; right: -24px; transform: scaleX(-1); }
  .sfc-bl { bottom: -18px; left: -24px; transform: scaleY(-1); }
  .sfc-br { bottom: -18px; right: -24px; transform: scale(-1, -1); }

  .sakura-bridal-matting {
    padding: 8px;
    border-radius: 142px 142px 18px 18px;
    background: #FAF3E8;
    border: 1px solid rgba(139, 28, 41, 0.35);
  }

  .sakura-bridal-portrait {
    position: relative;
    width: 248px;
    height: 325px;
    border-radius: 134px 134px 12px 12px;
    overflow: hidden;
    border: 2px solid #D4AF37;
    background: #26080E;
  }

  /* Framing Gambar 2 (Drive 2: 1eTjiCq_kGE_c7pG6mqejL12iNokL7i8g — Ulfa & Dimas memegang bingkai) */
  .sakura-bridal-img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: 50% 62%;
    display: block;
  }

  .sakura-portrait-caption {
    position: absolute;
